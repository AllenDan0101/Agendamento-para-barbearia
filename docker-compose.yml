services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_DRIVER: sqlite
      SQLITE_PATH: /data/barbearia.db
      JWT_SECRET: altere-este-segredo-em-producao
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      SEED: "true"
    volumes:
      - api-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/api/saude').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: barbearia
      POSTGRES_PASSWORD: barbearia
      POSTGRES_DB: barbearia
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbearia -d barbearia"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  api-data:
  pg-data:
